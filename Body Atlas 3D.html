<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Body Atlas 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(17,20,28,.78);--line:rgba(255,255,255,.09);--txt:#eaedf4;--mut:#8f97ab;--acc:#5b8cff;--ok:#36d399;--bad:#ff5d6c;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sheetH:200px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 85% at 50% 38%,#1b2131 0%,#0c0f17 55%,#05060a 100%);color:var(--txt);font:14px/1.4 Inter,system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;outline:none}
.glass{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px}
header{position:fixed;left:0;right:0;top:0;padding:calc(10px + var(--sat)) 12px 0;display:flex;align-items:center;gap:10px;pointer-events:none;z-index:5}
header>*{pointer-events:auto}
#ttl{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.ibtn{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:17px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#logo{background:linear-gradient(140deg,#ff6b7d,#5b8cff);border:0;font-size:19px}
h1{font:600 22px/1.05 Fraunces,Georgia,serif;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chips{position:fixed;left:0;right:0;top:calc(60px + var(--sat));display:flex;gap:7px;overflow-x:auto;padding:2px 12px 6px;scrollbar-width:none;z-index:4}
#chips::-webkit-scrollbar,.tg::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:500 13px Inter,sans-serif;display:flex;gap:6px;align-items:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip .e{font-size:14px}
#count{position:fixed;top:calc(106px + var(--sat));left:15px;font-size:11px;color:var(--mut);display:flex;gap:7px;align-items:center;z-index:3;pointer-events:none}
#count i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sab));width:min(560px,calc(100% - 20px));padding:8px 12px 12px;z-index:6}
#grab{display:block;margin:0 auto 6px;width:56px;height:16px;border:0;background:none;position:relative}
#grab:after{content:"";position:absolute;left:14px;right:14px;top:6px;height:4px;border-radius:4px;background:rgba(255,255,255,.22)}
#sheet.min .full{display:none}
.seg{display:flex;background:rgba(255,255,255,.05);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:500 12.5px Inter,sans-serif;padding:7px 0;border-radius:9px}
.seg button.on{background:rgba(255,255,255,.13);color:var(--txt)}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#c3c9d6;margin:11px 2px 6px}
.lbl b{font-weight:500;color:var(--mut);font-size:11px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--acc) var(--p,0%),rgba(255,255,255,.12) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 0 0 5px rgba(91,140,255,.35),0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 5px rgba(91,140,255,.35)}
input[type=range]:disabled{opacity:.35}
.ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:-2px}
.tg{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tg .chip{padding:7px 11px;font-size:12px;background:rgba(255,255,255,.06);backdrop-filter:none;-webkit-backdrop-filter:none}
.tg .chip.on{background:var(--acc)}
#card{position:fixed;right:12px;top:calc(128px + var(--sat));width:330px;max-height:calc(100% - var(--sheetH) - 160px);overflow:auto;padding:14px 14px 12px;z-index:7;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:760px){#card{left:10px;right:10px;width:auto;top:auto;bottom:calc(var(--sheetH) + 8px);max-height:36vh;padding:12px 12px 10px}#card ul{font-size:12.5px;margin:8px 0 10px}#card h2{font-size:19px;margin-top:6px}}
#card .tag{display:inline-block;font-size:10.5px;padding:3px 9px;border-radius:999px;background:rgba(91,140,255,.16);color:#a9c0ff;font-weight:500}
#card h2{font:600 21px/1.15 Fraunces,Georgia,serif;margin:8px 30px 2px 0}
#card .alt{color:var(--mut);font-style:italic;font-size:12px}
#card ul{padding-left:18px;margin:10px 0 12px;color:#d3d8e3;font-size:13px}
#card li{margin:6px 0}
#card li::marker{color:var(--acc)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);border-radius:10px;padding:8px 12px;font:500 12.5px Inter,sans-serif}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#cX{position:absolute;top:10px;right:10px;width:30px;height:30px;font-size:14px;border-radius:9px}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.pin{position:absolute;left:0;top:0;will-change:transform;transition:opacity .2s}
.pin .d{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(91,140,255,.55),0 0 14px rgba(91,140,255,.9)}
.pin .ln{position:absolute;left:3px;top:-3px;width:22px;height:1.5px;background:rgba(255,255,255,.7);transform-origin:0 50%;transform:rotate(-40deg)}
.pin .l{position:absolute;left:20px;top:-36px;white-space:nowrap;font:600 12px Inter,sans-serif;padding:5px 9px;border-radius:9px;background:rgba(10,12,18,.86);border:1px solid rgba(255,255,255,.14);color:#fff}
.pin .l small{display:block;color:var(--mut);font-size:10px;font-weight:400}
.pin.mini .d{width:7px;height:7px;margin:-3.5px 0 0 -3.5px;box-shadow:0 0 0 2px rgba(91,140,255,.5)}
.pin.mini .ln{width:12px;left:2px}
.pin.mini .l{font-size:10.5px;font-weight:500;padding:3px 7px;top:-22px;left:11px}
.pin.dim{opacity:.32}
.pin.flip .l{left:auto;right:20px}.pin.flip .ln{left:auto;right:3px;transform-origin:100% 50%;transform:rotate(40deg)}.pin.mini.flip .l{right:11px}.pin.mini.flip .ln{right:2px}
.pin.big .l{font:600 14px Fraunces,Georgia,serif;padding:5px 10px}
#quiz{position:fixed;left:50%;transform:translateX(-50%);top:calc(128px + var(--sat));padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;width:min(480px,calc(100% - 20px));z-index:7}
#quiz .q{flex:1;min-width:0}
#quiz .q small{display:block;color:var(--mut);font-size:11px}
#quiz .q b{font:600 17px Fraunces,Georgia,serif}
#qs{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.92);padding:11px 18px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9;background:rgba(10,12,18,.9);border:1px solid var(--line)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.ok{color:var(--ok)}#toast.bad{color:var(--bad)}
#list{position:fixed;inset:0;background:rgba(4,5,9,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;justify-content:flex-end;z-index:10}
#list .pane{width:min(390px,100%);height:100%;padding:calc(14px + var(--sat)) 12px calc(12px + var(--sab));display:flex;flex-direction:column;border-radius:0;border-width:0 0 0 1px}
#list .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
#q{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);padding:0 12px;font:14px Inter,sans-serif;outline:none}
#items{overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.grp{font:600 11px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 6px 6px}
.it{padding:9px 10px;border-radius:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer}
.it:hover,.it:active{background:rgba(255,255,255,.07)}
.it span{color:var(--mut);font-size:11px;font-style:italic;text-align:right}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:#06070b;z-index:50;transition:opacity .6s}
#loader .bx{text-align:center;width:240px}
#loader h3{font:600 28px Fraunces,Georgia,serif;margin:0 0 4px}
#loader p{color:var(--mut);font-size:12px;margin:0 0 16px;min-height:16px}
#loader .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6b7d,#5b8cff);transition:width .2s}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sheetH) + 14px);font-size:12px;color:#c9cfdb;background:rgba(10,12,18,.7);border:1px solid var(--line);padding:6px 12px;border-radius:999px;z-index:3;pointer-events:none;transition:opacity .5s;white-space:nowrap}
[hidden]{display:none!important}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<header>
  <div id="ttl">
    <button class="ibtn" id="back" hidden aria-label="Back to body">‹</button>
    <div class="ibtn" id="logo" aria-hidden="true">◐</div>
    <div style="min-width:0"><h1 id="sysName">Human Body</h1><div id="sub">Biology · 3D Atlas</div></div>
  </div>
  <button class="ibtn" id="listBtn" aria-label="All structures">☰</button>
</header>
<nav id="chips"></nav>
<div id="count"><i></i><span id="cnt">Visible structures: 0</span></div>
<div id="hint">Drag to rotate · pinch to zoom · tap a part</div>

<div id="quiz" class="glass" hidden>
  <div class="q"><small>Quiz · tap the structure</small><b id="qName">—</b></div>
  <div id="qs">0 / 0</div>
  <button class="btn" id="qShow">Show</button>
  <button class="btn" id="qEnd">End</button>
</div>

<div id="card" class="glass" hidden>
  <button class="btn" id="cX" aria-label="Close">✕</button>
  <span class="tag" id="cSys"></span>
  <h2 id="cName"></h2>
  <div class="alt" id="cAlt"></div>
  <ul id="cFacts"></ul>
  <div class="row">
    <button class="btn pri" id="cOpen">Open</button>
    <button class="btn" id="cFocus">Zoom in</button>
    <button class="btn" id="cIso">Isolate</button>
    <button class="btn" id="cHide">Hide</button>
  </div>
</div>

<div id="sheet" class="glass">
  <button id="grab" aria-label="Collapse panel"></button>
  <div class="full">
    <div class="seg" id="views">
      <button data-v="front" class="on">Front</button><button data-v="back">Back</button><button data-v="left">Left</button><button data-v="right">Right</button><button data-v="top">Top</button>
    </div>
    <div class="lbl"><span>Spread structures apart</span><b id="exV">Assembled</b></div>
    <input type="range" id="explode" min="0" max="100" value="0">
    <div class="ends"><span>Assembled</span><span>Exploded</span></div>
  </div>
  <div class="tg" id="toggles">
    <button class="chip" data-t="labels">🏷 Labels</button>
    <button class="chip" data-t="xray">◌ X-ray</button>
    <button class="chip" data-t="section">✂ Section</button>
    <button class="chip" data-t="quiz">🎯 Quiz</button>
    <button class="chip on" data-t="skel">🦴 Skeleton</button>
    <button class="chip on" data-t="skin">👤 Skin</button>
    <button class="chip" data-t="context">◎ Body context</button>
    <button class="chip" data-t="showall" hidden>👁 Show hidden</button>
    <button class="chip" data-t="reset">⟲ Reset</button>
  </div>
</div>

<div id="list" hidden>
  <div class="pane glass">
    <div class="top"><input id="q" placeholder="Search structures…" autocomplete="off"><button class="ibtn" id="lX">✕</button></div>
    <div id="items"></div>
  </div>
</div>
<div id="toast"></div>
<div id="loader"><div class="bx"><h3>Body Atlas</h3><p id="ldTxt">Loading 3D engine…</p><div class="bar"><i id="ldBar"></i></div></div></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {mergeVertices,mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const $=s=>document.querySelector(s);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const A=p=>Array.isArray(p)?new THREE.Vector3(p[0],p[1],p[2]):p.clone();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const gauss=(x,s)=>Math.exp(-(x/s)*(x/s));
let seedN=7;const rnd=()=>{seedN=(seedN*16807)%2147483647;return (seedN-1)/2147483646};

/* ================= FACTS (NEET / NCERT level) ================= */
const INFO={
'Right atrium':{a:'Atrium dextrum',f:['Receives deoxygenated blood from the superior & inferior venae cavae and the coronary sinus.','Contains the SA node (sino-atrial node) — the natural pacemaker of the heart.','Opens into the right ventricle through the tricuspid valve.']},
'Left atrium':{a:'Atrium sinistrum',f:['Receives oxygenated blood from the lungs through four pulmonary veins.','Opens into the left ventricle through the bicuspid (mitral) valve.','Forms most of the base (back surface) of the heart.']},
'Right ventricle':{a:'Ventriculus dexter',f:['Pumps deoxygenated blood into the pulmonary trunk → lungs (pulmonary circulation).','Its exit is guarded by the pulmonary semilunar valve.','Wall is thinner than the left ventricle — it pumps against lower pressure.']},
'Left ventricle':{a:'Ventriculus sinister',f:['Thickest-walled chamber — pumps oxygenated blood into the aorta (systemic circulation).','Forms the apex of the heart.','Its exit is guarded by the aortic semilunar valve; chordae tendineae anchor the mitral valve cusps.']},
'Aorta':{a:'Largest artery',f:['Largest artery of the body; arises from the left ventricle.','The arch gives 3 branches: brachiocephalic trunk, left common carotid and left subclavian arteries.','Continues down as the thoracic and then abdominal aorta.']},
'Pulmonary trunk':{a:'Truncus pulmonalis',f:['Carries deoxygenated blood from the right ventricle towards the lungs.','Divides into right and left pulmonary arteries — the only arteries carrying deoxygenated blood (after birth).','Linked to the aortic arch by the ligamentum arteriosum (remnant of the foetal ductus arteriosus).']},
'Superior vena cava':{a:'Vena cava superior',f:['Returns deoxygenated blood from the head, neck and upper limbs.','Opens into the upper part of the right atrium.']},
'Inferior vena cava':{a:'Vena cava inferior',f:['Largest vein of the body — returns blood from the lower body to the right atrium.','Passes through the diaphragm (at about the T8 level).']},
'Pulmonary veins':{a:'Venae pulmonales',f:['Four veins (two from each lung) open into the left atrium.','The only veins carrying oxygenated blood (after birth).']},
'Coronary arteries':{a:'Arteriae coronariae',f:['First branches of the aorta — they supply the heart muscle itself.','The left coronary divides into the anterior interventricular (LAD) and circumflex arteries.','Narrowing (atherosclerosis) causes angina; blockage causes a heart attack (myocardial infarction).']},
'Larynx':{a:'Voice box',f:['Cartilaginous box that produces sound (has the vocal cords).','The epiglottis — a flap of elastic cartilage — covers the glottis during swallowing so food does not enter the trachea.','The thyroid cartilage forms the “Adam’s apple”.']},
'Thyroid gland':{a:'Endocrine gland',f:['Largest endocrine gland: two lobes joined by an isthmus across the trachea.','Secretes T₃ & T₄ (need iodine; regulate basal metabolic rate) and thyrocalcitonin (lowers blood Ca²⁺).','Iodine deficiency → goitre; hypothyroidism during pregnancy can cause cretinism in the baby.']},
'Trachea':{a:'Windpipe',f:['Straight tube extending to the mid-thoracic cavity, supported by C-shaped rings of hyaline cartilage (incomplete at the back).','Lined by ciliated epithelium with mucus to trap dust and germs.','Divides at the level of the 5th thoracic vertebra into right and left primary bronchi.']},
'Right main bronchus':{a:'Primary bronchus',f:['Shorter, wider and more vertical than the left one.','So inhaled foreign bodies most often lodge in the right bronchus.','Divides into 3 lobar bronchi — one for each right lobe.']},
'Left main bronchus':{a:'Primary bronchus',f:['Longer, narrower and more horizontal; passes below the aortic arch.','Divides into 2 lobar bronchi for the 2 left lobes.']},
'Bronchial tree':{a:'Arbor bronchialis',f:['Primary → secondary → tertiary bronchi → bronchioles → terminal bronchioles → alveoli.','Trachea, bronchi and initial bronchioles are supported by incomplete cartilaginous rings.','Alveoli are the site of gas exchange — O₂ and CO₂ move by simple diffusion.','Tip: turn on X-ray to see the tree inside the lungs.']},
'Right upper lobe':{a:'Lobus superior dexter',f:['One of the 3 lobes of the right lung.','Separated from the middle lobe by the horizontal fissure and from the lower lobe by the oblique fissure.']},
'Right middle lobe':{a:'Lobus medius',f:['Found only in the right lung.','Lies at the front, between the horizontal and oblique fissures.']},
'Right lower lobe':{a:'Lobus inferior dexter',f:['Lies mostly at the back; its base rests on the diaphragm.','The right lung is shorter and wider than the left — the liver pushes the right dome of the diaphragm up.']},
'Left upper lobe':{a:'Lobus superior sinister',f:['The left lung has only 2 lobes and one (oblique) fissure.','Has the cardiac notch — a hollow for the heart — and a tongue-like lingula below it.']},
'Left lower lobe':{a:'Lobus inferior sinister',f:['Lies below and behind the oblique fissure.','Each lung is covered by a double-layered pleura; pleural fluid between the layers reduces friction.']},
'Diaphragm':{a:'Diaphragma',f:['Dome-shaped skeletal muscle separating the thoracic and abdominal cavities.','In inspiration it contracts and flattens → chest volume rises → pressure falls → air flows in.','The right dome sits higher than the left (liver below). Nerve supply: phrenic nerve (C3–C5).']},
'Frontal lobe':{a:'Lobus frontalis',f:['Contains the primary motor cortex (precentral gyrus) for voluntary movement.','Prefrontal area: reasoning, planning, personality and emotions.','Broca’s area (speech production) lies here, usually in the left hemisphere.']},
'Parietal lobe':{a:'Lobus parietalis',f:['Contains the somatosensory cortex (postcentral gyrus) — touch, pain, temperature, pressure.','Separated from the frontal lobe by the central sulcus.']},
'Temporal lobe':{a:'Lobus temporalis',f:['Contains the auditory cortex (hearing).','Wernicke’s area (understanding speech) and the hippocampus (memory) are linked to it.','Separated from the frontal & parietal lobes by the lateral (Sylvian) sulcus.']},
'Occipital lobe':{a:'Lobus occipitalis',f:['Contains the primary visual cortex — processes signals from the eyes.','Lies at the back of each cerebral hemisphere.']},
'Cerebellum':{a:'“Little brain” · hindbrain',f:['Has a very convoluted surface (folia) to fit in more neurons.','Coordinates voluntary movement, posture and balance (equilibrium).','Contains more than half of all the neurons in the brain.']},
'Midbrain':{a:'Mesencephalon',f:['Lies between the thalamus/hypothalamus of the forebrain and the pons.','Its dorsal part has four round lobes — corpora quadrigemina — for visual and auditory reflexes.','The cerebral aqueduct passes through it.']},
'Pons':{a:'Hindbrain',f:['Consists of fibre tracts that interconnect different regions of the brain.','Contains the pneumotaxic centre, which moderates the breathing rhythm.']},
'Medulla oblongata':{a:'Hindbrain',f:['Connected to the spinal cord.','Has centres that control respiration, cardiovascular reflexes and gastric secretions.','Brain stem = midbrain + pons + medulla oblongata.']},
'Spinal cord':{a:'Medulla spinalis',f:['Runs inside the vertebral canal from the medulla to about the L1–L2 vertebra in adults.','Gives rise to 31 pairs of spinal nerves.','Grey matter is inside (butterfly-shaped) and white matter outside — the reverse of the cerebrum. Centre for spinal reflexes.']},
'Corpus callosum':{a:'Forebrain commissure',f:['Large tract of nerve fibres connecting the left and right cerebral hemispheres.','Tip: spread structures apart to see it between the hemispheres.']},
'Thalamus':{a:'Diencephalon · forebrain',f:['Wrapped by the cerebrum; a major coordinating (relay) centre for sensory and motor signals.']},
'Hypothalamus':{a:'Diencephalon · forebrain',f:['Lies at the base of the thalamus.','Controls body temperature and the urge to eat and drink.','Neurosecretory cells release hypothalamic hormones (releasing/inhibiting) that control the pituitary.']},
'Pituitary gland':{a:'Hypophysis · “master gland”',f:['Sits in the sella turcica, attached to the hypothalamus by a stalk.','Adenohypophysis: GH, PRL, TSH, ACTH, LH, FSH (MSH from pars intermedia).','Neurohypophysis stores & releases oxytocin and vasopressin (ADH), which are made by the hypothalamus.']},
'Pineal gland':{a:'Epiphysis cerebri',f:['Located on the dorsal side of the forebrain.','Secretes melatonin — regulates the 24-hour (diurnal) sleep–wake rhythm and body temperature.']},
'Oesophagus':{a:'Food pipe',f:['Thin, long tube passing through the neck, thorax and diaphragm to the stomach.','Moves food by peristalsis; a gastro-oesophageal sphincter controls entry into the stomach.']},

/* ================= STATE / UI ================= */
const BODY={id:'body',name:'Human Body',sub:'Biology · 3D Atlas · tap any structure',focusC:V(0,3.55,0),focusR:4.4};

function layout(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h);
  const T=$('#chips').getBoundingClientRect().bottom+18;const S=h-$('#sheet').getBoundingClientRect().top+4;
  const yc=T+(h-T-S)/2,d=h/2-yc,F=h+2*Math.abs(d),y0=d>0?2*d:0;
  camera.aspect=w/F;camera.setViewOffset(w,F,0,y0,w,h);camera.updateProjectionMatrix();VIEW={w,h,F,u:Math.max(120,h-T-S)};
  document.documentElement.style.setProperty('--sheetH',(S+6)+'px');

function fitDist(R){const tf=Math.tan(THREE.MathUtils.degToRad(camera.fov)/2);const vf=2*Math.atan(tf*VIEW.u/VIEW.F),hf=2*Math.atan(tf*VIEW.w/VIEW.F);return R/Math.sin(Math.min(vf,hf)/2)}
function flyTo(c,R,dir){const p0=camera.position.clone(),t0=controls.target.clone();const off=p0.clone().sub(t0);const d0=off.clone().normalize(),l0=off.length();
  const d1=(dir?dir.clone():d0.clone()).normalize();fly={t:0,t0,t1:c.clone(),d0,l0,l1:fitDist(R),q:new THREE.Quaternion().setFromUnitVectors(d0,d1)}}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function buildChips(){const c=$('#chips');const items=[['body','🧍','Body'],...ORDER.map(id=>[id,SYS[id].emoji,SYS[id].name])];
  c.innerHTML=items.map(([id,e,n])=>`<button class="chip" data-m="${id}"><span class="e">${e}</span>${n}</button>`).join('');
  c.onclick=e=>{const b=e.target.closest('[data-m]');if(b)setMode(b.dataset.m)}}
function setMode(id,doFly=true){
  mode=id;iso=null;select(null);explodeT=0;$('#explode').value=0;updSlider();section=false;
  const f=curF();$('#sysName').textContent=f.name;$('#sub').textContent=f.sub;$('#back').hidden=id==='body';$('#logo').hidden=id!=='body';
  document.querySelectorAll('#chips .chip').forEach(b=>b.classList.toggle('on',b.dataset.m===id));
  const on=document.querySelector(`#chips [data-m="${id}"]`);on&&on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  $('#explode').disabled=id==='body';
  tgl('section').hidden=!(f.section);tgl('skel').hidden=id!=='body';tgl('skin').hidden=id!=='body';tgl('context').hidden=id==='body';
  syncToggles();applyVis();
  if(doFly)flyTo(f.focusC,f.focusR,id==='body'?V(0.32,0.1,1):V(0.45,0.15,1));

const tgl=t=>document.querySelector(`#toggles [data-t="${t}"]`);
function syncToggles(){tgl('labels').classList.toggle('on',labelsOn);tgl('xray').classList.toggle('on',xray);tgl('section').classList.toggle('on',section);tgl('skel').classList.toggle('on',skelOn);tgl('skin').classList.toggle('on',skinOn);tgl('context').classList.toggle('on',context);tgl('quiz').classList.toggle('on',!!quiz);tgl('showall').hidden=!hidden.size&&!iso}
function isActive(m){const s=m.userData.sys;return mode==='body'?(s!=='skeleton'||skelOn):s===mode}
function applyVis(){
  for(const m of MESHES){const ud=m.userData;const act=isActive(m);let vis=act||(context&&mode!=='body');
    if(hidden.has(ud.part.name)||(iso&&act&&ud.part!==iso))vis=false;m.visible=vis;ud.pickable=vis&&act&&ud.pick;
    let op=1;if(!act)op=0.07;else if(xray&&ud.outer&&ud.part!==sel)op=0.14;
    m.material.opacity=op;m.material.depthWrite=op>0.99;
    m.material.clippingPlanes=(section&&act&&ud.clip)?[ud.clip]:null;}
  if(shell)shell.visible=mode==='body'&&skinOn;updateCount();
}
function activeParts(){const s=new Set();for(const m of MESHES)if(m.visible&&m.userData.pickable)s.add(m.userData.part);return [...s]}
function updateCount(){$('#cnt').textContent='Visible structures: '+activeParts().length}
function rep(m){if(m.userData.rep)return m.userData.rep;const ud=m.userData,pos=m.geometry.attributes.position;const c=ud.center;let out=c.clone().sub(SYS[ud.sys].ecenter);if(out.lengthSq()<1e-4)out.set(0,0,1);out.normalize();
  const T=c.clone().addScaledVector(out,ud.size*1.5);let best=0,bd=1e9;const st=Math.max(1,Math.floor(pos.count/1500));const v=new THREE.Vector3();
  for(let i=0;i<pos.count;i+=st){v.fromBufferAttribute(pos,i);const d=v.distanceToSquared(T);if(d<bd){bd=d;best=i}}return ud.rep=v.fromBufferAttribute(pos,best).clone()}
function bestMesh(p){let b=null,s=-1;for(const m of p.meshes)if(m.visible&&m.userData.size>s){s=m.userData.size;b=m}return b||p.meshes[0]}
let hl=[];
function select(p,mesh,point,sub){
  for(const m of hl)m.material.emissive.setRGB(0,0,0);hl=[];sel=p;selSub=sub||null;
  if(!p){selAnchor=null;$('#card').hidden=true;if(autoMin){autoMin=false;$('#sheet').classList.remove('min');layout()}applyVis();return}
  const m=mesh||bestMesh(p);selAnchor={mesh:m,local:point?m.worldToLocal(point.clone()):rep(m).clone()};hl=p.meshes.slice();
  if(!quiz)showCard(p,selSub);applyVis();
}
let autoMin=false;
function showCard(p,sub){if(innerWidth<760&&!$('#sheet').classList.contains('min')){autoMin=true;$('#sheet').classList.add('min');layout()}$('#cSys').textContent=SYS[p.sys].emoji+' '+SYS[p.sys].name;$('#cName').textContent=p.name;$('#cAlt').textContent=[p.info.a,sub].filter(Boolean).join(' · ');
  $('#cFacts').innerHTML=p.info.f.map(f=>`<li>${f}</li>`).join('');$('#cOpen').hidden=mode!=='body';$('#cOpen').textContent='Open '+SYS[p.sys].name+' →';
  $('#cIso').textContent=iso===p?'Show all':'Isolate';$('#cIso').hidden=mode==='body';$('#card').hidden=false;$('#card').style.animation='none';$('#card').offsetHeight;$('#card').style.animation=''}
function focusPart(p){const b=new THREE.Box3();for(const m of p.meshes)if(m.visible)b.expandByObject(m);if(b.isEmpty())return;const s=b.getBoundingSphere(new THREE.Sphere());flyTo(s.center,Math.max(s.radius*1.15,0.28))}

let tT=null;function toast(t,c){const e=$('#toast');e.textContent=t;e.className='show '+(c||'');clearTimeout(tT);tT=setTimeout(()=>e.className=c||'',1300)}
function quizNext(){const ps=activeParts().filter(p=>p.name!==quiz.last);if(!ps.length){$('#qName').textContent='Nothing visible';return}const p=ps[Math.floor(Math.random()*ps.length)];quiz.target=p.name;quiz.last=p.name;quiz.locked=false;$('#qName').textContent=p.name;renderQ()}
function renderQ(){let best=0;try{best=+localStorage.getItem('atlasBest')||0}catch(e){}$('#qs').innerHTML=`<b style="color:#fff;font-size:14px">${quiz.score}</b> / ${quiz.tries}<br>best ${best}`}
function quizTap(p,m,pt){if(quiz.locked)return;quiz.tries++;
  if(p.name===quiz.target){quiz.score++;toast('✓ Correct!','ok');try{const b=+localStorage.getItem('atlasBest')||0;if(quiz.score>b)localStorage.setItem('atlasBest',quiz.score)}catch(e){}
    select(p,m,pt,m.userData.sub);quiz.locked=true;setTimeout(()=>{if(quiz){select(null);quizNext()}},1100)}
  else{toast('✗ That’s '+p.name,'bad');flash(p)}renderQ()}
let flashM=[],flashT=0;function flash(p){flashM=p.meshes.slice();flashT=0.7}
function startQuiz(){quiz={score:0,tries:0,last:null};select(null);$('#quiz').hidden=false;quizNext();syncToggles();toast('Tip: use X-ray / Spread / Section to find hidden parts')}
function endQuiz(){quiz=null;$('#quiz').hidden=true;select(null);syncToggles()}

function onTap(cx,cy){
  const r=renderer.domElement.getBoundingClientRect();ndc.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
  const cand=MESHES.filter(m=>m.visible&&m.userData.pickable);
  let hits=ray.intersectObjects(cand,false).filter(h=>{const pl=h.object.material.clippingPlanes;return !pl||pl.every(q=>q.distanceToPoint(h.point)>=0)});
  if(xray){const solid=hits.find(h=>h.object.material.opacity>0.99);if(solid)hits=[solid]}
  const h=hits[0];
  if(!h){if(!quiz)select(null);return}
  const m=h.object,p=m.userData.part;if(quiz){quizTap(p,m,h.point);return}
  select(p,m,h.point,m.userData.sub);
}

/* labels */
const pool=[];function pinEl(i){let p=pool[i];if(!p){p=document.createElement('div');p.className='pin';p.innerHTML='<div class="ln"></div><div class="d"></div><div class="l"></div>';$('#labels').appendChild(p);pool[i]=p}p.style.display='';return p}
function updateLabels(){
  const L=[];const f=curF();
  if(sel&&selAnchor&&selAnchor.mesh.visible)L.push({w:selAnchor.mesh.localToWorld(selAnchor.local.clone()),t:sel.name,s:selSub||'',c:'sel'});
  if(labelsOn&&!quiz){
    if(mode==='body'){for(const id of ORDER){if(id==='skeleton'&&!skelOn)continue;L.push({w:SYS[id].labelP,t:SYS[id].name,c:'big'})}}
    else for(const p of activeParts()){if(p===sel)continue;const m=bestMesh(p);if(!m||!m.visible)continue;L.push({w:m.localToWorld(rep(m).clone()),t:p.name,c:'mini',dimc:true})}}
  const dC=camera.position.distanceTo(f.focusC);let n=0;
  for(const it of L){const v=it.w.clone().project(camera);if(v.z>1||v.z<-1)continue;const x=(v.x+1)/2*VIEW.w,y=(1-v.y)/2*VIEW.h;
    const el=pinEl(n++);const key=it.t+'|'+it.s;if(el._k!==key){el.querySelector('.l').innerHTML=it.t+(it.s?`<small>${it.s}</small>`:'');el._k=key}
    const dim=it.dimc&&camera.position.distanceTo(it.w)>dC+f.focusR*0.08;el.className='pin '+it.c+(dim?' dim':'')+(x>VIEW.w*0.6?' flip':'');el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`}
  for(let i=n;i<pool.length;i++)pool[i].style.display='none';
}

/* list */
function buildList(q=''){q=q.trim().toLowerCase();let html='';
  for(const id of ORDER){const ps=Object.values(PARTS).filter(p=>p.sys===id&&(!q||p.name.toLowerCase().includes(q)||(p.info.a||'').toLowerCase().includes(q)));if(!ps.length)continue;
    html+=`<div class="grp">${SYS[id].emoji} ${SYS[id].name} · ${ps.length}</div>`+ps.map(p=>`<div class="it" data-n="${p.name}">${p.name}<span>${p.info.a||''}</span></div>`).join('')}
  $('#items').innerHTML=html||'<div class="grp">No match</div>'}

/* ================= EVENTS ================= */
let downP=null,ptrs=0;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{ptrs++;fly=null;controls.autoRotate=false;$('#hint').style.opacity=0;downP=ptrs===1?{x:e.clientX,y:e.clientY,t:performance.now()}:null});
cv.addEventListener('pointerup',e=>{ptrs=Math.max(0,ptrs-1);if(downP){const dx=e.clientX-downP.x,dy=e.clientY-downP.y;if(dx*dx+dy*dy<70&&performance.now()-downP.t<550)onTap(e.clientX,e.clientY)}downP=null});
cv.addEventListener('pointercancel',()=>{ptrs=0;downP=null});
cv.addEventListener('pointermove',e=>{if(ptrs>1)downP=null});
$('#back').onclick=()=>setMode('body');
const VD={front:V(0,0.08,1),back:V(0,0.08,-1),left:V(1,0.06,0),right:V(-1,0.06,0),top:V(0,1,0.03)};
$('#views').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#views button').forEach(x=>x.classList.toggle('on',x===b));const f=curF();flyTo(f.focusC,f.focusR,VD[b.dataset.v]);controls.autoRotate=false};
function updSlider(){const v=+$('#explode').value;$('#explode').style.setProperty('--p',v+'%');$('#exV').textContent=v<3?'Assembled':v>97?'Exploded':v+'%'}
$('#explode').oninput=e=>{explodeT=e.target.value/100;updSlider()};
$('#toggles').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;
  if(t==='labels')labelsOn=!labelsOn;else if(t==='xray')xray=!xray;else if(t==='section'){section=!section;if(section)toast(mode==='brain'?'Mid-sagittal section':'Coronal section of kidneys')}
  else if(t==='skel')skelOn=!skelOn;else if(t==='skin')skinOn=!skinOn;else if(t==='context')context=!context;
  else if(t==='quiz'){quiz?endQuiz():startQuiz()}else if(t==='showall'){hidden.clear();iso=null}
  else if(t==='reset'){hidden.clear();iso=null;explodeT=0;$('#explode').value=0;updSlider();select(null);const f=curF();flyTo(f.focusC,f.focusR,V(0.32,0.1,1))}
  syncToggles();applyVis();if(quiz&&(t==='skel'||t==='showall'))quizNext()};
$('#grab').onclick=()=>{autoMin=false;$('#sheet').classList.toggle('min');layout()};
$('#cX').onclick=()=>select(null);
$('#cOpen').onclick=()=>{const p=sel;setMode(p.sys,false);select(p);focusPart(p)};
$('#cFocus').onclick=()=>sel&&focusPart(sel);
$('#cHide').onclick=()=>{if(!sel)return;hidden.add(sel.name);if(iso===sel)iso=null;select(null);syncToggles();applyVis()};
$('#cIso').onclick=()=>{if(!sel)return;iso=iso===sel?null:sel;syncToggles();applyVis();showCard(sel,selSub);if(iso)focusPart(sel)};
$('#qEnd').onclick=endQuiz;
$('#qShow').onclick=()=>{if(!quiz||quiz.locked)return;const p=PARTS[quiz.target];quiz.tries++;quiz.locked=true;renderQ();hidden.delete(p.name);applyVis();select(p);focusPart(p);toast('Here it is: '+p.name);setTimeout(()=>{if(quiz){select(null);quizNext()}},2200)};
$('#listBtn').onclick=()=>{buildList($('#q').value);$('#list').hidden=false};
$('#lX').onclick=()=>$('#list').hidden=true;
$('#list').onclick=e=>{if(e.target.id==='list')$('#list').hidden=true};
$('#q').oninput=e=>buildList(e.target.value);
$('#items').onclick=e=>{const it=e.target.closest('.it');if(!it)return;const p=PARTS[it.dataset.n];$('#list').hidden=true;hidden.delete(p.name);if(mode!==p.sys&&mode!=='body')setMode(p.sys,false);else if(mode==='body')setMode(p.sys,false);applyVis();select(p);focusPart(p)};
addEventListener('resize',layout);

/* ================= LOOP ================= */
const clock=new THREE.Clock();let TT=0;
function tick(){
  requestAnimationFrame(tick);const raw=clock.getDelta(),dt=Math.min(raw,0.05);TT+=dt;
  explode+=(explodeT-explode)*Math.min(1,Math.min(raw,0.4)*7);
  for(const id in SYS){const s=SYS[id],e=mode===id?explode:0;for(const m of s.meshes)m.position.copy(m.userData.dir).multiplyScalar(e);
    if(s.planes)for(const P of s.planes){if(P.mesh)P.plane.constant=-P.n.dot(P.C.clone().add(P.mesh.position))}}
  if(fly){fly.t=Math.min(1,fly.t+Math.min(raw,0.3)/0.9);const k=ease(fly.t);controls.target.lerpVectors(fly.t0,fly.t1,k);const q=new THREE.Quaternion().slerpQuaternions(new THREE.Quaternion(),fly.q,k);
    camera.position.copy(controls.target).add(fly.d0.clone().applyQuaternion(q).multiplyScalar(THREE.MathUtils.lerp(fly.l0,fly.l1,k)));if(fly.t>=1)fly=null}
  controls.update();
  const pulse=0.22+0.12*Math.sin(TT*4.5);for(const m of hl)m.material.emissive.copy(m.userData.base).multiplyScalar(pulse);
  if(flashT>0){flashT-=dt;for(const m of flashM)m.material.emissive.setRGB(flashT>0?0.6*Math.max(0,flashT/0.7):0,0,0)}
  renderer.render(scene,camera);updateLabels();
  if(perf.n<120){perf.n++;perf.t+=raw;if(perf.n===120&&perf.t/120>1/32&&renderer.getPixelRatio()>1){renderer.setPixelRatio(1);layout()}}
}
const perf={n:-30,t:0};

/* ================= BOOT ================= */
async function boot(){
  const steps=[['brain',buildBrain],['heart',buildHeart],['lungs',buildLungs],['digestive system',buildDigestive],['kidneys',buildUrinary],['skeleton',buildSkeleton],['body',buildBody]];
  for(let i=0;i<steps.length;i++){$('#ldTxt').textContent='Building '+steps[i][0]+'…';$('#ldBar').style.width=(i/steps.length*100)+'%';await new Promise(r=>setTimeout(r,20));steps[i][1]()}
  for(const m of MESHES){const g=m.geometry;g.computeBoundingBox();g.computeBoundingSphere();const ud=m.userData;ud.center=g.boundingBox.getCenter(new THREE.Vector3());ud.size=g.boundingBox.getSize(new THREE.Vector3()).length()/2;
    ud.dir=ud.dirV?ud.dirV.clone():ud.center.clone().sub(SYS[ud.sys].ecenter).multiplyScalar(SYS[ud.sys].escale)}
  for(const m of MESHES)if(m.userData.dirOf)m.userData.dir=m.userData.dirOf.userData.dir;
  $('#ldBar').style.width='100%';buildChips();layout();
  camera.position.set(3.6,4.8,13.5);controls.target.copy(BODY.focusC);setMode('body',false);camera.position.copy(BODY.focusC).add(V(0.32,0.1,1).normalize().multiplyScalar(fitDist(BODY.focusR)));controls.autoRotate=true;
  updSlider();renderer.compile(scene,camera);tick();
  setTimeout(()=>{$('#loader').style.opacity=0;setTimeout(()=>$('#loader').remove(),650)},150);
  setTimeout(()=>$('#hint').style.opacity=0,7000);
}
boot().catch(e=>{$('#ldTxt').textContent='Error: '+e.message;console.error(e)});
</script>
